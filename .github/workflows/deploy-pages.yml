name: Deploy Public Site

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/deploy-pages.yml
      - scripts/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache British voice model
        uses: actions/cache@v4
        with:
          path: .cache/voice
          key: cori-alba-medium-c10ece1aade47bb51c153c893d14e5bf8e5b7117

      - name: Cache generated narration
        uses: actions/cache@v4
        with:
          path: .cache/clips
          key: narration-v1-${{ hashFiles('public/app.js', 'scripts/build_audio.py') }}-${{ github.run_id }}
          restore-keys: |
            narration-v1-${{ hashFiles('public/app.js', 'scripts/build_audio.py') }}-

      - name: Generate British English narration
        id: narration
        # An audio service failure must never hold back fresh flood observations.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts
          npm test
          python -m pip install -r scripts/requirements-audio.txt
          npm run audio:build

      - name: Report unavailable narration
        if: steps.narration.outcome == 'failure'
        run: echo "::warning::Narration build failed. Publishing current observations without audio."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
